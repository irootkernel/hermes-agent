      - hermes_cli/auth_commands.py
      - tests/agent/test_credential_pool.py
      - tests/agent/test_auxiliary_client.py
      - tests/hermes_cli/test_runtime_provider_resolution.py
      - tests/hermes_cli/test_auth_commands.py
    upstream_absorbed:
      - "v0.18.2 already creates independent openai-codex `manual:device_code` pool entries and avoids singleton collapse on add."
      - "v0.18.2 `_sync_codex_pool_entries()` preserves independent manual entries while refreshing singleton/legacy aliases."
    local_seams:
      - "Profile-local `.env` pins: `HERMES_CREDENTIAL_PIN_OPENAI_CODEX_ID`, `_LABEL`, and bare prefix-as-label convenience."
      - "Ambient process env is ignored for pins; only profile-local `.env` is read."
