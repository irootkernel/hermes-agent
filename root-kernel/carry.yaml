policy:
  code_base_is_final_patch_tag: true
  base_selection: v2026.7.7.2 is the code base; v0.18.0/v0.18.1/v0.18.2 release notes are evidence for impact analysis, not sequential merge steps.
  prefer_upstream_native_features_first: true
  no_patch_before_owner_direction_alignment: true
  local_carries_are_minimal_fail_closed_rk_extensions: true
  d_items_are_runtime_diffs_only: true
  r_items_are_activation_or_host_local_gates: true
  verification_scope: targeted_smoke_not_full_macos_suite
  docker_smoke_required_before_live_checkout_migration: true
  live_checkout_migration_target: /Users/draccoon/.hermes/hermes-agent
baseline_evidence:
  source_freeze:
    - command: git reset --hard v2026.7.7.2^{}
      result: rk/v0.18.2 HEAD reset to exact upstream v0.18.2 commit 9de9c25f620ff7f1ce0fd5457d596052d5159596
    - command: git merge-base --is-ancestor v2026.7.1 HEAD && git merge-base --is-ancestor v2026.7.7 HEAD && git merge-base --is-ancestor v2026.7.7.2 HEAD
      result: v0.18.0, v0.18.1, and v0.18.2 tags are all ancestors of the scaffold HEAD.
  local_hygiene:
    - command: add .omx/ to .gitignore and verify with git check-ignore
      result: .omx machine-local editor/agent state is ignored; no runtime/live state changed.
release_notes_signals:
  summary:
    - v0.18.0 is the Judgment Release; it reports a P0/P1 clean sweep, Mixture-of-Agents as a first-class model, evidence-based self-verification, /goal completion contracts, /learn and /journey visibility, background subagent fanout, gateway scale-to-zero/drain coordination, and desktop/dashboard changes.
    - v0.18.1 is an infrastructure-driven patch tag rolling up roughly 660 PRs since v0.18.0, including installer/updater self-healing on Windows, dashboard/gateway fixes, WhatsApp dashboard pairing, MCP/provider fixes, and broad stability work.
    - v0.18.2 is a same-day patch on v0.18.1 that unpins WhatsApp Baileys from a git commit and uses published 7.0.0-rc13 for reliable installs and Docker image builds.
  decision_impact:
    D8: Re-audit OpenAI Codex/OAuth provider, credential pool, auxiliary client, and labelled reauth changes before reapplying profile-local credential pins.
    D4: Re-audit Discord/gateway/free-response/auto-thread/thread ownership behavior after v0.18 gateway and dashboard fixes.
    D2: Re-audit Kanban, /goal completion contracts, background subagents, and any workflow/review native behavior before carrying same-card review/final-gate/mutex/workflow seams.
    D6: Re-audit CLI command dispatch and subprocess exit behavior before carrying return-code passthrough.
    D7: Re-audit doctor/tool availability warning behavior before carrying optional-warning filtering.
docker_smoke_policy:
  required_before_activation: true
  activation_boundary: Do not migrate /Users/draccoon/.hermes/hermes-agent, reinstall editable runtime, move rk/live, or restart gateways until candidate smoke for retained D-items has passed or blockers are explicitly accepted.
  default_shape:
    - read-only repository mount where possible
    - disposable HERMES_HOME inside container
    - no live .env, auth.json, tokens, production state.db, or production kanban.db mounts
    - candidate imports must resolve from this worktree, not the live checkout
    - smoke must exercise actual CLI/tool/runtime behavior for the D-item where applicable
  forbidden_without_separate_approval:
    - live messaging tokens in container
    - production profile homes or production databases in container
    - gateway restarts or live platform sends
