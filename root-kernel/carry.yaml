      - "`DISCORD_DEFAULT_THREAD_OWNER_PARENT_CHANNELS` remains env-only and lets profile-local single-owner parent channels claim unowned user-created child threads."
      - "Discord role mentions fail closed unless this bot is explicitly mentioned, so free-response/default-owner routing cannot steal role-addressed work."
      - "`thread_require_mention=true` still gates owned/default parent-thread fallback."
    smoke:
