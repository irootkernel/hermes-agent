entries:
  D1:
    title: Tool Search pair
    previous_v0_16_status: upstream-absorbed
    v0_17_status: resolved-no-local-carry-no-future-consideration
    owner_decision: Use upstream-native Tool Search/search_files behavior. Do not reintroduce a Root Kernel local patch.
    future_release_instruction: Do not reconsider D1 as a Root Kernel carry in future releases. It was already resolved/absorbed in v0.16.0 and is no longer part of the active carry set unless a wholly new, independent regression is discovered and assigned a new D-ID.
    code_patch_required: false
    audit_evidence:
      - command: docker run ... pytest -q tests/tools/test_tool_search.py -o addopts=
        result: 39 passed, 1 warning in Docker disposable env; warning was pytest cache write blocked by read-only repo mount
    docker_smoke:
      - targeted tool_search/search_files tests passed; no further D1 smoke required for carry replay.
  D2:
    title: Kanban review and same-card handoff helpers
    previous_v0_16_status: partial-native-local-minimized-d2b-d2c-d2d-d2e-d2f-d2g-d2h-d2i-applied
    v0_17_status: d2-a-through-d2-i-applied
    owner_decision: Keep the Kanban-first operating rule for official Root Kernel work. Do not replace D2 with async delegate_task for v0.17.0; carry D2-a through D2-i, while using delegate_task gradually only as a supplemental/experimental path after activation experience accumulates.
    default_recommendation: retain-full-d2-a-through-d2-i-on-v0-17-native-base
    decision_question: resolved; 주군 selected full D2 carry and Kanban-first continuity despite v0.17 async delegate_task improvements.
    pre_apply_required: Apply each retained D2 subitem with minimal v0.17-native-base patches, ledger updates, and targeted disposable Kanban smoke before advancing to the next subitem.
    delegate_task_policy: v0.17 background delegate_task is useful for non-official exploratory/support work, but it is not yet trusted as the durable review-gate, creator-acceptance, audit, mutex, or formal assignee workflow backbone.
    planned_subitems:
      D2-a: applied - audit and ledger native-vs-local classification
      D2-b: applied - cooperative same-card handoff/reassign helper
      D2-c: applied - worker submit-for-review same-card transition
      D2-d: applied - reviewer request-changes/rework transition
      D2-e: applied - creator/final gate separation from reviewer done
      D2-f: applied - async review watcher/outcome notification support
      D2-g: applied - creator-accepted result loop
      D2-h: applied - mutex_key serialization for shared artifacts/resources
      D2-i: applied - workflow context banners for K-style Kanban workflows
    code_patch_required: true
    files_changed:
      - agent/prompt_builder.py
      - hermes_cli/kanban.py
      - hermes_cli/kanban_db.py
      - gateway/kanban_watchers.py
      - tools/kanban_tools.py
      - toolsets.py
      - tests/hermes_cli/test_kanban_cli.py
      - tests/hermes_cli/test_kanban_db.py
      - tests/gateway/test_kanban_notifier.py
      - tests/tools/test_kanban_tools.py
    audit_evidence:
      - command: read release note evidence and tools/delegate_tool.py plus tools/async_delegation.py for v0.17 async delegate_task behavior
        result: delegate_task(background=true) dispatches a single background subagent, returns a delegation_id handle immediately, caps concurrent async children, and re-enters the result through process_registry.completion_queue; this improves non-blocking delegation but does not provide a durable Kanban task id, formal assignee review gate, creator/final approval split, mutex, or workflow banner semantics.
      - command: search/read v0.17 Kanban review surfaces in hermes_cli/kanban_db.py and tests/hermes_cli/test_kanban_db.py
        result: v0.17 has native review status handling, claim_review_task, has_spawnable_review, and review dispatcher coverage, but D2 same-card submit-review/request-changes/creator-gate/mutex/workflow-banner helpers remain Root Kernel-specific seams.
      - command: /Users/draccoon/.local/bin/hermes-python -m pytest -q tests/hermes_cli/test_kanban_db.py::{test_claim_review_task_transitions_to_running,test_claim_review_task_fails_on_non_review,test_claim_review_task_fails_when_already_claimed,test_has_spawnable_review_true,test_has_spawnable_review_false_on_empty,test_has_spawnable_review_false_when_only_terminal_lanes} -o addopts=
        result: 6 passed on host; native v0.17 review claim/spawnability baseline is working before D2 local carry application.
      - command: add D2-b handoff_task plus kanban_reassign tests before implementation, then run focused RED smoke
        result: 5 expected failures before implementation; missing hermes_cli.kanban_db.handoff_task, missing tools.kanban_tools._handle_reassign, and kanban_reassign absent from schemas.
      - command: implement minimal D2-b same-card handoff seam
        result: handoff_task closes active run as status=released/outcome=handed_off, clears claim/current_run/worker state, resets failure counters, returns the same task to ready for the target assignee, emits handed_off event, and stale expected_run_id fails without mutation. kanban_reassign exposes the worker tool with same-task ownership, HERMES_KANBAN_RUN_ID stale-run guard, and HERMES_SESSION_ID metadata stamping.
      - command: implement minimal D2-c submit-for-review seam on native v0.17 review
