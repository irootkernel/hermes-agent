entries:
  D1:
    title: Tool Search pair
    previous_v0_17_status: resolved-no-local-carry-no-future-consideration
    v0_18_status: retired-carry-forward
    code_patch_required: false
    next_action: Do not replay; only a new independent regression may receive a new D-ID.
  D2:
    title: Kanban review and same-card handoff helpers
    previous_v0_17_status: d2-a-through-d2-i-applied
    v0_18_status: local_minimize_applied
    priority: 3
    code_patch_required: true
    decision: "D2-a audit complete, then D2-b unified implementation, D2-f review watcher, D2-g creator/acceptor result submission loop, D2-h mutex serialization, and D2-i closed workflow context banners applied: preserve v0.18.2 native review/goal/notify/swarm/workflow foundations and carry only missing Root Kernel same-card and prompt-safe workflow seams."
    evidence:
      - root-kernel/evidence/d2-a-kanban-native-overlap.md
    upstream_native_foundations:
      - "Native `review` status, `claim_review_task`, review dispatch, and `has_spawnable_review` exist and should not be reimplemented."
      - "`kanban_notify_subs`, notify subscribe/list/unsubscribe, dashboard home-subscribe, and gateway Kanban notifier exist and should be extended only for review-specific outcomes."
      - "`/goal` completion contracts and Kanban `goal_mode` / `goal_max_turns` exist; they are complementary, not replacements for same-card review gates."
      - "Background `delegate_task` fan-out and Kanban Swarm v1 exist; they do not provide D2's durable same-card id, formal assignee/reviewer/final gate, mutex, or workflow-banner semantics."
      - "Generic `workflow_template_id` / `current_step_key` metadata exists; D2-i should add only closed Root Kernel workflow context banners if carried."
    applied_subitems:
      D2-b:
        title: same-card review loop
        includes:
          - "former D2-b cooperative same-card handoff / worker-facing reassign"
          - "former D2-c worker submit-for-review seam on top of native review"
          - "former D2-d reviewer request-changes return-to-rework loop"
          - "former D2-e creator/final gate after reviewer approval"
        files_changed:
          - hermes_cli/kanban_db.py
          - tools/kanban_tools.py
          - toolsets.py
          - tests/hermes_cli/test_kanban_db.py
          - tests/tools/test_kanban_tools.py
      D2-f:
        title: async review watcher notifications
        includes:
          - "`kanban_submit_review` attaches a review watch subscription when a gateway/TUI delivery source is available."
          - "The review watch receipt reports attached platform/chat/thread/user/profile metadata to the worker."
          - "Gateway Kanban notifier delivers `requested_changes` and `review_accepted` review-outcome events without retiring the subscription before final task state."
        files_changed:
          - tools/kanban_tools.py
          - gateway/kanban_watchers.py
          - tests/tools/test_kanban_tools.py
          - tests/gateway/test_kanban_notifier.py
      D2-g:
        title: creator/acceptor result submission loop
        includes:
          - "`submit_task_result` closes worker runs as `submitted_result` / `released` and routes the same card to creator/acceptor review."
          - "`kanban_submit_result` and CLI `submit-result` expose same-card result acceptance without marking the task done."
          - "`kanban_request_changes` can return creator/acceptor review from either `submitted_review` or `submitted_result` provenance while `review_accepted` remains peer-review-only."
          - "Worker lifecycle guidance distinguishes `kanban_complete`, `kanban_submit_review`, and `kanban_submit_result`."
        files_changed:
          - hermes_cli/kanban_db.py
          - tools/kanban_tools.py
          - toolsets.py
          - hermes_cli/kanban.py
          - agent/prompt_builder.py
          - tests/hermes_cli/test_kanban_db.py
          - tests/tools/test_kanban_tools.py
          - tests/hermes_cli/test_kanban_cli.py
      D2-h:
        title: mutex-key serialization
        includes:
          - "Tasks can carry nullable `mutex_key` values, trimmed on create and preserved in JSON/tool output plus created-event audit payloads."
          - "Ready and review dispatch defer same-key cards behind running or same-tick-selected owners and report `skipped_mutex_locked` as non-error serialization telemetry."
          - "Direct `claim_task` and `claim_review_task` reject same-key claims while another task is running, with `claim_rejected` reason `mutex_locked`."
          - "Spawnability health checks ignore mutex-deferred ready/review work so serialized queues are not misreported as stuck."
        files_changed:
          - hermes_cli/kanban_db.py
          - tools/kanban_tools.py
          - hermes_cli/kanban.py
          - tests/hermes_cli/test_kanban_db.py
          - tests/tools/test_kanban_tools.py
          - tests/hermes_cli/test_kanban_cli.py
      D2-i:
        title: closed workflow context banners
        includes:
          - "Tasks can carry nullable closed-enum `workflow_type` values without replacing upstream `workflow_template_id` / `current_step_key` metadata."
          - "Worker context injects a prompt-safe `## Workflow context` banner only for known Root Kernel workflow protocols."
          - "Create-time unknown `workflow_type` values fail closed, while invalid persisted values sanitize to null and never render as prompt text."
          - "CLI `--workflow-type` and `kanban_create` / list / show surfaces expose sanitized workflow types."
        files_changed:
          - hermes_cli/kanban_db.py
          - tools/kanban_tools.py
          - hermes_cli/kanban.py
          - tests/hermes_cli/test_kanban_db.py
          - tests/tools/test_kanban_tools.py
          - tests/hermes_cli/test_kanban_cli.py
    remaining_local_seams: []
    smoke:
      - "D2-a symbol probe: D2 handoff/submit-review/request-changes/submit-result symbols absent; native review/workflow metadata present; mutex_key/workflow_type absent."
      - "D2-a native review focused pytest slice -> 10 passed in 0.76s."
      - "D2-a review/goal/notify overlap pytest slice -> 15 passed in 1.37s."
      - "D2-b RED: 7 focused same-card review loop tests failed on v0.18.2 base due to missing `handoff_task`, `submit_task_for_review`, `request_changes_task`, and tool registrations."
      - "D2-b GREEN: 18 focused DB/tool same-card review loop tests -> 18 passed in 1.31s."
      - "D2-b GREEN: worker/orchestrator Kanban tool visibility tests -> 4 passed in 0.91s."
      - "D2-b GREEN: tests/hermes_cli/test_kanban_db.py tests/tools/test_kanban_tools.py -> 338 passed in 27.70s."
      - "D2-f RED: 5 focused review watcher tests failed on v0.18.2+D2-b because `review_watch` receipt/subscription and review-outcome notifier delivery were absent."
      - "D2-f GREEN: focused review watcher tests -> 5 passed in 0.66s."
      - "D2-f GREEN: tests/tools/test_kanban_tools.py tests/gateway/test_kanban_notifier.py -> 113 passed in 10.38s."
      - "D2-g RED: 9 focused result-submission tests failed on v0.18.2+D2-b/f because `submit_task_result`, `kanban_submit_result`, CLI `submit-result`, toolset visibility, request-changes result provenance, and worker prompt guidance were absent."
      - "D2-g GREEN: focused DB/tool/CLI/prompt result-submission tests -> 9 passed in 2.90s."
      - "D2-g GREEN: tests/hermes_cli/test_kanban_db.py tests/tools/test_kanban_tools.py tests/hermes_cli/test_kanban_cli.py tests/gateway/test_kanban_notifier.py -> 407 passed in 34.13s."
      - "D2-h RED: 10 focused mutex-key tests failed on v0.18.2+D2-b/f/g because `mutex_key`, dispatcher deferral, direct-claim guards, tool schema, and CLI `--mutex-key` were absent."
      - "D2-h GREEN: focused DB/tool/CLI mutex-key tests -> 12 passed in 1.09s."
      - "D2-h GREEN: tests/hermes_cli/test_kanban_db.py tests/tools/test_kanban_tools.py tests/hermes_cli/test_kanban_cli.py tests/gateway/test_kanban_notifier.py -> 419 passed in 41.82s."
      - "D2-i RED: 10 focused workflow-banner tests failed on v0.18.2+D2-b/f/g/h because `workflow_type`, closed workflow banners, CLI `--workflow-type`, tool schema/output, and invalid persisted-value sanitization were absent."
      - "D2-i GREEN: focused DB/tool/CLI workflow-banner tests -> 10 passed in 0.86s."
      - "D2-i GREEN: tests/hermes_cli/test_kanban_db.py tests/tools/test_kanban_tools.py tests/hermes_cli/test_kanban_cli.py tests/hermes_cli/test_kanban_core_functionality.py tests/gateway/test_kanban_notifier.py -> 597 passed, 1 skipped in 46.14s."
    next_action: D2 local carry is complete for v0.18.2; audit D6 CLI return-code passthrough next.
  D3:
    title: Kanban assignee alias dispatch seam
    previous_v0_17_status: retired
    v0_18_status: retired-carry-forward
    code_patch_required: false
    next_action: Do not replay unless a new independent alias regression is discovered and assigned a new D-ID.
  D4:
    title: Discord owner/thread routing and role-mention fail-close
    previous_v0_17_status: local-keep-applied
    v0_18_status: local_minimize_applied
    priority: 2
    code_patch_required: true
    decision: "주군 selected option A: reapply only the missing Root Kernel Discord owner/thread safety seams on top of v0.18.2 upstream behavior."
    files_changed:
      - gateway/platforms/helpers.py
      - plugins/platforms/discord/adapter.py
      - tests/gateway/test_discord_free_response.py
      - tests/gateway/test_discord_channel_controls.py
      - tests/e2e/conftest.py
    upstream_absorbed:
      - "v0.18.2 already has current channel-key matching, auto-thread failure visible-error/no-agent fallback, auto-thread rename metadata, and Discord liveness/reconnect improvements."
    local_seams:
      - "Persistent `ThreadOwnerTracker` records Discord thread_id -> owner key in `discord_thread_owners.json` without stealing existing owners."
      - "Mention-free thread follow-up now requires this bot to own the thread; participation alone is not enough."
