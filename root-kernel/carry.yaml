  D4:
    title: Discord owner/thread routing and role-mention fail-close
    previous_v0_16_status: local-keep-with-parent-owner-env-fallback
    v0_17_status: local-minimize-applied
    default_recommendation: adopt-v0.17-gateway-refactor-then-retain-only-owner-thread-fail-close-seams
    owner_decision: Proceed with option B. Use v0.17 Discord/gateway structure as the base, then retain only the Root Kernel safety guarantees still missing upstream.
    code_patch_required: true
    files_changed:
      - gateway/platforms/helpers.py
      - plugins/platforms/discord/adapter.py
      - tests/gateway/test_discord_free_response.py
    retained_guarantees:
      - Thread participation alone must not grant mention-free ownership; only the recorded owner/default responder may receive no-mention follow-ups.
      - Auto-created Discord threads are recorded as both participated and owned by the current bot profile.
      - Role mentions without this bot's direct mention fail closed so default/free-response routing cannot steal role-addressed tasks.
      - Parent text-channel free-response does not automatically apply to ordinary child text threads opened by another bot; forum-thread inheritance remains allowed.
      - DISCORD_DEFAULT_THREAD_OWNER_PARENT_CHANNELS is an env-only profile-local fallback for parent channels whose user-created child threads belong to this bot.
      - DISCORD_AUTO_THREAD_FREE_RESPONSE or top-level/config extra auto_thread_free_response can explicitly allow free-response channels to still spawn owned auto-threads.
    audit_evidence:
      - command: git grep/read v0.17 Discord adapter for ThreadOwnerTracker, role_mentions, auto_thread_free_response, and DISCORD_DEFAULT_THREAD_OWNER_PARENT_CHANNELS
