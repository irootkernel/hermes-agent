    previous_v0_17_status: minimized-local-keep-applied
    v0_18_status: local_minimize_applied
    priority: 1
    code_patch_required: true
    decision: "Preserve v0.18.2 upstream independent-account behavior and add only Root Kernel profile-local Codex pin/fail-closed seams plus label-targeted reauth duplicate guard."
    files_changed:
      - agent/credential_pool.py
      - agent/auxiliary_client.py
