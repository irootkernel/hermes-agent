schema_version: 1
release:
  branch: rk/v0.17.0
  upstream_tag: v2026.6.19
  upstream_version: v0.17.0
  upstream_commit: 2bd1977d8fad185c9b4be47884f7e87f1add0ce3
  previous_downstream_branch: rk/v0.16.0
  previous_downstream_commit: c3c60ccb192526b0f459a1a6bc198dd1b9f0f554
  release_note_evidence: root-kernel/evidence/release-note-v2026.6.19.md
baseline_evidence:
  source_freeze:
    - command: git fetch --tags upstream '+refs/tags/v2026.6.19:refs/tags/v2026.6.19'
      result: tag present; v2026.6.19^{} resolved to 2bd1977d8fad185c9b4be47884f7e87f1add0ce3
    - command: git branch backup/17e-v0.16.0-before-v0.17.0-20260620-175015 17e/v0.16.0
      result: backup ref created at c3c60ccb192526b0f459a1a6bc198dd1b9f0f554
    - command: git switch -c 17e/v0.17.0 v2026.6.19^{}
      result: candidate branch created at exact upstream release commit
  docker_baseline:
    - command: docker run --rm -i -v "$PWD:/repo:ro" -w /repo -e HERMES_HOME=/tmp/hermes-home -e PYTHONPATH=/repo ghcr.io/astral-sh/uv:0.11.6-python3.13-trixie python - <ast-parse-smoke>
      result: docker ast parse ok for hermes_cli/main.py, hermes_cli/config.py, hermes_cli/doctor.py, hermes_cli/kanban_db.py, tools/kanban_tools.py
    - command: docker run --rm -i -v "$PWD:/repo:ro" -w /repo -e HOME=/tmp/hermes-user -e HERMES_HOME=/tmp/hermes-home -e UV_CACHE_DIR=/tmp/uv-cache -e UV_PROJECT_ENVIRONMENT=/tmp/hermes-venv -e PYTHONPATH=/repo ghcr.io/astral-sh/uv:0.11.6-python3.13-trixie bash -lc 'uv sync --frozen --no-install-project && /tmp/hermes-venv/bin/python -m hermes_cli.main --version'
      result: Hermes Agent v0.17.0 (2026.6.19) CLI version smoke succeeded in disposable Docker env
  namespace_migration:
    - command: git branch backup/rk-namespace-migration-before-rename-20260620-183211 17e/v0.17.0 && git branch backup/rk-v0.16.0-before-rename-20260620-183211 17e/v0.16.0
      result: rollback refs created before local namespace rename; v0.17 rollback at 2bd1977d8fad185c9b4be47884f7e87f1add0ce3 and v0.16 rollback at c3c60ccb192526b0f459a1a6bc198dd1b9f0f554
    - command: git branch -m 17e/v0.16.0 rk/v0.16.0 && git branch -m 17e/v0.17.0 rk/v0.17.0
      result: local branch namespace moved to Root Kernel refs without rewriting commits
    - command: git tag rk/tag/v0.16.0 17e/tag/v0.16.0 && git tag -d 17e/tag/v0.16.0
      result: local fixed checkout tag namespace moved to rk/tag/v0.16.0; no remote refs changed
    - command: mv 17e root-kernel && mv for_17th_earth.md for-root-kernel.md
      result: local release artifacts renamed to Root Kernel paths
policy:
  status_decisions_are_per_delta_commits: true
  no_patch_before_owner_direction_alignment: true
  prefer_upstream_native_features_first: true
  local_carries_are_minimal_fail_closed_rk_extensions: true
  drop_means_mark_absorbed_or_retired_not_delete: true
  verification_scope: targeted_smoke_not_full_macos_suite
  docker_smoke_required_before_live_checkout_migration: true
  live_checkout_migration_target: /Users/draccoon/.hermes/hermes-agent
  d_items_are_runtime_diffs_only: true
  r_items_are_activation_or_host_local_gates: true
release_notes_signals:
  summary:
    - v0.17.0 is the Reach Release with new communication channels, desktop/dashboard upgrades, async subagents, automation blueprints, image editing, memory/curator changes, and major refactors.
    - cli.py, gateway/run.py, and run_agent.py underwent large refactors, so old carry patches must not be replayed blindly.
    - New messaging platforms include iMessage via Photon, Raft, WhatsApp Business Cloud API, and SimpleX; Discord carries must be checked against gateway core/rendering changes.
    - Core/tool changes include background async subagents, search_files densification, removed agent-callable send_message, read_file document extraction, context/compression changes, memory batch operations, and write_approval.
    - Curator routine curation is now deterministic/token-free unless consolidation is enabled; R1/R2/R5 activation policy should absorb this rather than recreate old local behavior.
  decision_impact:
    D2: Re-audit native team/automation/Kanban surfaces before carrying old same-card review helpers.
    D4: Re-audit gateway/Discord adapter refactors before carrying owner-thread routing seams.
    D6: Re-audit extracted CLI parser/main return-code boundaries before patching.
    D7: Re-audit doctor/tool warning behavior with new optional tools and write_approval.
    D8: Re-audit auth/provider changes before carrying profile-local Codex credential pins.
docker_smoke_policy:
  required_before_activation: true
  activation_boundary: Do not migrate /Users/draccoon/.hermes/hermes-agent, reinstall editable runtime, move rk/live, or restart gateways until Docker smoke for the candidate branch has passed or blockers are explicitly accepted.
  default_shape:
    - read-only repository mount where possible
    - disposable HERMES_HOME inside container
    - no live .env, auth.json, tokens, production state.db, or production kanban.db mounts
    - PYTHONPATH or editable install must point at the candidate repo, not the live checkout
    - feature smoke must exercise actual CLI/tool behavior, not only static diff inspection
  allowed:
    - targeted pytest for touched D-items
    - disposable Kanban DB same-task workflow smoke
    - disposable credential-pool fake-token smoke
    - gateway/Discord routing unit smoke with fake objects
    - doctor/CLI subprocess smoke
  forbidden_without_separate_approval:
    - live messaging tokens in container
    - production profile homes or production databases in container
    - gateway restarts or live platform sends
rules:
  R1:
    title: Config/profile activation policy
    status: pending-r-pre-audit
    scope:
      - default and named profile config.yaml files
      - config schema/version migration
      - hermes config check and hermes doctor
      - new v0.17 write_approval, automation blueprint, dashboard/profile-builder defaults
    activation_impact: host-local config and doctor triage gate; not a runtime carry
    next_action: read-only profile config audit after D candidate settles; mutate only in activation window.
  R2:
    title: Skill provenance, overrides, and compatibility policy
    status: pending-r-pre-audit
    scope:
      - bundled/upstream skills
      - optional skills
      - shared ops skills.external_dirs
      - profile-local overrides and active cron skills
      - v0.17 Skills Hub and write_approval behavior
    activation_impact: host-local skill compatibility gate; not a runtime carry
    next_action: compare v0.16 and v0.17 bundled/optional skills; do not restore removed upstream skills as D-items.
  R3:
    title: Web dashboard and desktop activation gate
    status: pending-r-pre-audit
    scope:
      - dashboard profile builder and auth changes
      - desktop watch-windows/model selector/theme updates
      - web_dist and desktop build/smoke
    activation_impact: host-local GUI surface gate; not a runtime carry
    next_action: candidate Docker/host build smoke only after D candidate; persistent launchd/dashboard changes require approval.
  R4:
    title: Cron, automation blueprints, and local script activation gate
    status: pending-r-pre-audit
    scope:
      - active cron jobs and scripts
      - automation blueprints introduced in v0.17
      - shared /Users/draccoon/Workspace/Hermes/ops/scripts automation tree
      - watcher jobs and hardcoded checkout paths
    activation_impact: host-local automation gate; not a runtime carry unless product code must change.
    next_action: read-only cron/script inventory and classify whether automation blueprints replace any local cron prompts.
  R5:
    title: Profile-owned local asset optimization after v0.17 activation
    status: deferred-until-after-d-candidate
    scope:
      - Root Kernel-owned skills
      - Root Kernel-owned cron prompts
      - canonical ops scripts
      - usage-style updates for v0.17 native surfaces
    activation_impact: post-candidate local asset pass; not a prerequisite for D-code branch creation.
entries:
  D1:
    title: Tool Search pair
    previous_v0_16_status: upstream-absorbed
    v0_17_status: resolved-no-local-carry-no-future-consideration
    owner_decision: Use upstream-native Tool Search/search_files behavior. Do not reintroduce a Root Kernel local patch.
    future_release_instruction: Do not reconsider D1 as a Root Kernel carry in future releases. It was already resolved/absorbed in v0.16.0 and is no longer part of the active carry set unless a wholly new, independent regression is discovered and assigned a new D-ID.
    code_patch_required: false
    audit_evidence:
      - command: docker run ... pytest -q tests/tools/test_tool_search.py -o addopts=
        result: 39 passed, 1 warning in Docker disposable env; warning was pytest cache write blocked by read-only repo mount
    docker_smoke:
      - targeted tool_search/search_files tests passed; no further D1 smoke required for carry replay.
  D2:
    title: Kanban review and same-card handoff helpers
    previous_v0_16_status: partial-native-local-minimized-d2b-d2c-d2d-d2e-d2f-d2g-d2h-d2i-applied
    v0_17_status: pending-owner-direction
    default_recommendation: audit-v0.17-native-first-then-minimize-local-extensions
    decision_question: For each D2 subitem, switch to v0.17 native team/automation/Kanban features where sufficient, and carry only Root Kernel creator-gate/fail-closed gaps?
    pre_apply_required: Native surface audit and owner direction per subitem D2-b through D2-i.
    docker_smoke:
      - disposable Kanban DB workflow smoke for each retained subitem.
      - targeted tests/hermes_cli and tests/tools Kanban tests inside Docker.
  D3:
    title: Kanban assignee alias dispatch seam
    previous_v0_16_status: retired-after-refactor
    v0_17_status: retired-use-v0-17-native-no-future-consideration
    owner_decision: Do not restore the Root Kernel assignee alias dispatch seam. Use v0.17 native Kanban/profile dispatch behavior going forward.
    future_release_instruction: Do not reconsider D3 as a Root Kernel carry in future releases. Assignee alias dispatch is retired; any future need must be treated as a new independent D-ID, not D3 replay.
    code_patch_required: false
    audit_evidence:
      - command: git grep for assignee_alias/resolve_assignee plus has_spawnable_ready/has_spawnable_review/default_assignee
        result: no assignee_alias seam observed; v0.17 has profile_exists-based spawnability checks, default_assignee, max_in_progress_per_profile, and multiprofile gateway surfaces
    docker_smoke:
      - not required for carry replay; v0.17 native path will be covered by later D2/Kanban Docker smoke if Kanban changes are retained.
  D4:
    title: Discord owner/thread routing and role-mention fail-close
    previous_v0_16_status: local-keep-with-parent-owner-env-fallback
    v0_17_status: pending-owner-direction
    default_recommendation: adopt-v0.17-gateway-refactor-then-retain-only-owner-thread-fail-close-seams
    decision_question: Should v0.17 Discord/gateway native behavior be the base, with Root Kernel owner-thread/role-mention fail-close guarantees retained if still missing?
    pre_apply_required: Audit v0.17 Discord adapter, gateway thread handling, role mention handling, and parent-channel ownership behavior.
    docker_smoke:
      - fake Discord object routing tests in Docker.
      - no live Discord token or send.
  D5:
    title: Support-only plugin strategy
    previous_v0_16_status: retired-no-code
    v0_17_status: retired-no-code-no-future-consideration
    owner_decision: Treat D5 as a past policy only. Do not restore a support-only plugin strategy for v0.17.
    future_release_instruction: Do not reconsider D5 as a Root Kernel carry in future releases. It is retired policy history; any future plugin strategy must be assigned a new independent D-ID with a concrete current need.
    code_patch_required: false
    audit_evidence:
      - command: git grep for support-only/migration plugin/17th references under plugins hermes_cli tests
        result: no active support-only plugin dependency found in v0.17 candidate source
    docker_smoke:
      - not required; no active source dependency and no carry replay.
  D6:
    title: CLI return-code passthrough
    previous_v0_16_status: local-keep
    v0_17_status: local-keep-applied
    default_recommendation: retain-minimal-bool-safe-return-code-passthrough
    owner_decision: Retain D6 as a minimal Root Kernel local patch because v0.17 still discards integer return codes from subcommands.
    code_patch_required: true
    files_changed:
      - hermes_cli/main.py
      - tests/hermes_cli/test_main_exit_codes.py
      - tests/hermes_cli/test_kanban_core_functionality.py
    audit_evidence:
      - command: git show 41409d981 -- hermes_cli/main.py tests/hermes_cli/test_main_exit_codes.py
        result: v0.16 D6 added _exit_if_int_return_code(rc), called it after args.func(args), and added subprocess tests for missing Kanban task rc=1, usage rc=2, help rc=0, plus exact-int-not-bool behavior.
      - command: read current hermes_cli/main.py command execution tail
        result: v0.17 currently executes args.func(args) and discards its return value; no _exit_if_int_return_code helper exists.
      - command: read tests/hermes_cli/test_kanban_core_functionality.py around test_cli_bulk_complete_with_summary_rejects
        result: upstream v0.17 test comment explicitly notes hermes_cli.main does not propagate sub-command exit codes because args.func(args) discards the return value.
      - command: docker run ... python -m hermes_cli.main kanban show definitely_missing_task
        result: "stderr 'no such task: definitely_missing_task' but process rc=0; expected automation-safe rc=1."
      - command: docker run ... python -m hermes_cli.main kanban boards switch ""
        result: "stderr 'slug is required' but process rc=0; expected usage rc=2."
      - command: docker run ... python -m hermes_cli.main kanban --help
        result: process rc=0 as expected.
    docker_smoke:
      - command: docker run --rm -i -v "$PWD:/repo:ro" -w /repo ... bash -lc 'uv sync --frozen --extra dev --no-install-project && /tmp/hermes-venv/bin/python -m pytest -q tests/hermes_cli/test_main_exit_codes.py -o addopts='
        result: 7 passed, 1 warning in Docker disposable env; warning was pytest cache write blocked by read-only repo mount.
      - command: docker run --rm -i -v "$PWD:/repo:ro" -w /repo ... python -m hermes_cli.main kanban show definitely_missing_task / kanban boards switch "" / kanban --help
        result: missing task rc=1 with expected stderr; usage rc=2 with expected stderr; help rc=0 with usage output.
  D7:
    title: Doctor optional tool warning filter
    previous_v0_16_status: local-keep
    v0_17_status: local-keep-applied
    default_recommendation: retain-minimal-config-scoped-doctor-warning-filter
    owner_decision: Retain D7 as a minimal Root Kernel local patch because v0.17 still reports API-key warnings for disabled/default-off optional toolsets.
    code_patch_required: true
    files_changed:
      - hermes_cli/doctor.py
      - tests/hermes_cli/test_doctor.py
    audit_evidence:
      - command: git show c8f98d219 -- hermes_cli/doctor.py tests/hermes_cli/test_doctor.py
        result: v0.16 D7 added a config-scoped Tool Availability filter and tests for disabled optional toolsets versus explicitly selected optional toolsets.
      - command: grep release note and current hermes_cli/doctor.py for D7 helper names
        result: v0.17 release notes and source show no equivalent upstream doctor Tool Availability config filter.
      - command: docker run ... check_tool_availability versus _get_platform_tools(DEFAULT_CONFIG, "cli")
        result: before filter, API-key unavailable rows were discord, discord_admin, moa, web, x_search; only web was enabled/actionable for the default CLI scope.
    docker_smoke:
      - command: docker run --rm -i -v "$PWD:/repo:ro" -w /repo ... pytest -q tests/hermes_cli/test_doctor.py::TestDoctorToolAvailabilityConfigFilter -o addopts=
        result: 3 passed, 1 warning in Docker disposable env; warning was pytest cache write blocked by read-only repo mount.
      - command: docker run --rm -i -v "$PWD:/repo:ro" -w /repo ... pytest -q tests/hermes_cli/test_doctor.py tests/hermes_cli/test_doctor_dedicated_provider_skip.py -o addopts=
        result: 71 passed, 1 warning in Docker disposable env; warning was pytest cache write blocked by read-only repo mount.
      - command: docker run --rm -i -v "$PWD:/repo:ro" -w /repo ... check_tool_availability then _filter_doctor_tool_availability_for_config
        result: API-key unavailable rows changed from discord, discord_admin, moa, web, x_search to web only under disposable default CLI config.
    next_release_instruction: Re-check upstream doctor Tool Availability scoping; if upstream hides disabled/default-off optional toolset warnings equivalently while keeping enabled warnings, mark D7 upstream-absorbed and drop the local helper.
  D8:
    title: OpenAI Codex credential pinning and labelled reauth
    previous_v0_16_status: local-keep
    v0_17_status: local-minimize-applied
    default_recommendation: retain-profile-local-env-pin-plus-labelled-reauth-update-in-place
    owner_decision: Retain D8 as a minimized Root Kernel local patch. v0.17 native behavior keeps Codex pool accounts distinct on add/re-auth, but does not provide profile-local credential affinity pins or label-targeted update-in-place semantics required for Root Kernel multi-profile GPT/Codex operation.
    code_patch_required: true
    files_changed:
      - agent/credential_pool.py
      - agent/auxiliary_client.py
      - hermes_cli/runtime_provider.py
      - hermes_cli/auth.py
      - hermes_cli/auth_commands.py
      - tests/agent/test_credential_pool.py
      - tests/agent/test_auxiliary_client.py
      - tests/hermes_cli/test_runtime_provider_resolution.py
      - tests/hermes_cli/test_auth_codex_provider.py
      - tests/hermes_cli/test_auth_commands.py
    upstream_overlap:
      - "v0.17 release notes mention provider/auth work: keep Codex OAuth pool accounts distinct on add/re-auth."
      - v0.17 auth_commands.py already creates distinct openai-codex manual:device_code pool entries instead of collapsing every add into the singleton.
      - v0.17 _sync_codex_pool_entries preserves independent manual:device_code entries whose token material does not match the previous singleton.
      - No v0.17 source support found for HERMES_CREDENTIAL_PIN_OPENAI_CODEX_ID, HERMES_CREDENTIAL_PIN_OPENAI_CODEX_LABEL, get_credential_pin, has_configured_credential_pin, or credential_pins.
    local_seam:
      - "profile-local .env only pins: HERMES_CREDENTIAL_PIN_OPENAI_CODEX_ID wins over HERMES_CREDENTIAL_PIN_OPENAI_CODEX_LABEL; a bare HERMES_CREDENTIAL_PIN_OPENAI_CODEX is accepted as label convenience."
      - process environment variables are ignored for pin assignment to prevent parent gateway/profile bleed-through.
      - CredentialPool select/peek/acquire_lease resolve pins id-first/label-exact and fail closed on missing, duplicate, exhausted, dead, or otherwise unavailable pinned entries.
      - runtime_provider raises AuthError(code=credential_pin_unavailable) instead of falling back to singleton or another pool entry when a pin is configured but unavailable.
      - auxiliary Codex token resolution also stops before singleton fallback when a pin is configured but no pinned pool token is available.
      - hermes auth add openai-codex --label LABEL updates exactly one matching device_code/manual:device_code pool entry, creates a labelled manual:device_code entry if absent, fails closed on duplicate labels, and leaves other labels plus the provider singleton unchanged.
    host_smoke:
      - command: PYTHONPATH=$PWD /Users/draccoon/.local/bin/hermes-python -m pytest -q tests/agent/test_credential_pool.py::test_codex_profile_env_label_pin_selects_matching_entry ... tests/hermes_cli/test_auth_commands.py::test_auth_add_openai_codex_label_updates_matching_entry_only -o addopts=
        result: 11 passed on host disposable fake-token tests.
      - command: PYTHONPATH=$PWD /Users/draccoon/.local/bin/hermes-python -m pytest -q tests/agent/test_credential_pool.py tests/hermes_cli/test_runtime_provider_resolution.py tests/hermes_cli/test_auth_codex_provider.py tests/hermes_cli/test_auth_commands.py -o addopts=
        result: 302 passed on host targeted related suite.
      - command: PYTHONPATH=$PWD /Users/draccoon/.local/bin/hermes-python -m pytest -q tests/agent/test_auxiliary_client.py::TestReadCodexAccessToken tests/agent/test_auxiliary_client.py::test_codex_auxiliary_does_not_fallback_to_singleton_when_pin_unavailable -o addopts=
        result: 10 passed on host targeted auxiliary Codex token tests.
    docker_smoke:
      - command: docker run --rm -i -v "$PWD:/repo:ro" -w /repo ... uv sync --frozen --extra dev && pytest D8 targeted 11-test list -o addopts=
        result: 11 passed, 1 warning in Docker disposable env; warning was pytest cache write blocked by read-only repo mount.
      - command: docker run --rm -i -v "$PWD:/repo:ro" -w /repo ... uv sync --frozen --extra dev && pytest tests/agent/test_credential_pool.py tests/hermes_cli/test_runtime_provider_resolution.py tests/hermes_cli/test_auth_codex_provider.py tests/hermes_cli/test_auth_commands.py tests/agent/test_auxiliary_client.py::TestReadCodexAccessToken tests/agent/test_auxiliary_client.py::test_codex_auxiliary_does_not_fallback_to_singleton_when_pin_unavailable -o addopts=
        result: 312 passed, 1 warning in Docker disposable env; warning was pytest cache write blocked by read-only repo mount.
      - command: docker run --rm -i -v "$PWD:/repo:ro" -w /repo ... disposable HERMES_HOME with .env label pin and fake openai-codex pool
        result: selected_label HSY and selected_id hsy; no live auth.json, token, profile home, or gateway state mounted.
    next_release_instruction: Re-check upstream OpenAI Codex multi-account affinity. If upstream supports profile-local pinning with fail-closed id/unique-label semantics plus label-targeted reauth that preserves other labels and the provider singleton, mark D8 upstream-absorbed; otherwise retain the minimized Root Kernel seam.
next_steps:
  - Continue remaining D-item owner gates in order: D4 Discord owner/thread routing audit, then D2 Kanban review/handoff subitems.
  - Do not move rk/live or /Users/draccoon/.hermes/hermes-agent until D/R gates and Docker smoke are complete and approved.
